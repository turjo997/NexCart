name: CI - Spring Boot + SonarQube

on:
  workflow_dispatch:

  push:
    branches: [ test ]

  pull_request:
    branches: [ test ]
    types: [opened, synchronize, reopened]

jobs:

  build-test:
    name: Build & Test Java
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nexCart_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Wait for Postgres
        run: |
          for i in {1..20}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 3
          done

      - name: Cache Maven
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-maven-

      - name: Build & Run Tests
        run: mvn clean verify


  # ---------------- LINT JOB (ONLY WHEN FILES CHANGE) ----------------
  lint:
    name: Run Checkstyle + PMD + SpotBugs
    runs-on: ubuntu-latest
    needs: build-test

    # run ONLY if these files changed
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '') 

    steps:
      - uses: actions/checkout@v4

      - name: Check if relevant files changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            java:
              - '**/*.java'
              - 'pom.xml'
              - '**/application*.yml'
              - '**/application*.properties'

      - name: Set up JDK
        if: steps.filter.outputs.java == 'true'
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Run Checkstyle
        if: steps.filter.outputs.java == 'true'
        run: mvn checkstyle:check

      - name: Run PMD
        if: steps.filter.outputs.java == 'true'
        run: mvn pmd:check

      - name: Run SpotBugs
        if: steps.filter.outputs.java == 'true'
        run: mvn spotbugs:check

      - name: Skip message
        if: steps.filter.outputs.java != 'true'
        run: echo "No relevant files changed. Skipping lint."


  # ---------------- SONARQUBE (UNCHANGED) ----------------
  sonarqube:
    name: SonarQube Analysis
    runs-on: ubuntu-latest
    needs: build-test

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: nexCart_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: root
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 3
          done

      - name: Run SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=turjo997_NexCart


  create-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GIT_PAT }}
        run: |
          if gh pr list --base main --head test --state open | grep -q "test"; then
            echo "PR already exists, skipping creation."
          else
            gh pr create \
              --base main \
              --head test \
              --title "Auto PR: Merge test into main" \
              --body "This pull request was automatically created by GitHub Actions."
            echo "PR created successfully."
          fi