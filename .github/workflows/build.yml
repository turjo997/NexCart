name: Build & Push Image

on:
  workflow_dispatch: 
  push:
    branches: [ test ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build image
        run: docker build -t ullash997/my-nexcart-web-app:1.0.2 .

      - name: Push image
        run: docker push ullash997/my-nexcart-web-app:1.0.2
