<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Product List</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 30px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .header h2 {
            margin: 0;
            color: #2c3e50;
        }

        .btn {
            padding: 8px 14px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary {
            background: #4a6cf7;
            color: #fff;
        }

        .btn-primary:hover {
            background: #3b5bdb;
        }

        .card {
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f0f2f7;
        }

        th, td {
            padding: 12px 14px;
            text-align: left;
            font-size: 14px;
        }

        th {
            color: #555;
            font-weight: 600;
        }

        tr:not(:last-child) td {
            border-bottom: 1px solid #eee;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 500;
        }

        .active {
            background: #e6f4ea;
            color: #2e7d32;
        }

        .inactive {
            background: #fdecea;
            color: #c62828;
        }

        .actions a {
            margin-right: 10px;
            font-size: 13px;
            text-decoration: none;
        }

        .edit {
            color: #4a6cf7;
        }

        .delete {
            color: #e74c3c;
        }

        .edit:hover,
        .delete:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="header">
    <h2>Products</h2>
    <a th:href="@{/products/create}" class="btn btn-primary">+ Add Product</a>
</div>

<div class="card">
    <table>
        <thead>
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Category</th>
            <th>Status</th>
            <th style="width:160px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="product : ${products}">
            <td th:text="${product.id}"></td>
            <td th:text="${product.name}"></td>
            <td th:text="${product.price}"></td>
            <td th:text="${product.stockQuantity}"></td>
            <td th:text="${product.category}"></td>
            <td>
                <span th:class="${product.active ? 'badge active' : 'badge inactive'}"
                      th:text="${product.active ? 'Active' : 'Inactive'}">
                </span>
            </td>
            <td class="actions">
                <a th:href="@{/products/edit/{id}(id=${product.id})}" class="edit">Edit</a>
                <a th:href="@{/products/delete/{id}(id=${product.id})}"
                   class="delete"
                   onclick="return confirm('Delete this product?')">Delete</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
