<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id == null ? 'Save User' : 'Edit User'}"></title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f5f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .card {
            background: #ffffff;
            width: 380px;
            padding: 30px 35px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin: 0 0 25px;
            text-align: center;
            color: #2c3e50;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 6px;
            color: #555;
        }

        input {
            width: 100%;
            padding: 10px 12px;
            font-size: 14px;
            border-radius: 6px;
            border: 1px solid #dcdfe6;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #4a6cf7;
        }

        button {
            width: 100%;
            padding: 11px;
            background: #4a6cf7;
            border: none;
            border-radius: 6px;
            color: #ffffff;
            font-size: 15px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #3b5bdb;
        }

        .footer-link {
            margin-top: 15px;
            text-align: center;
        }

        .footer-link a {
            font-size: 13px;
            color: #4a6cf7;
            text-decoration: none;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">

        <h2 th:text="${user.id == null ? 'Create User' : 'Edit User'}"></h2>

        <form th:action="@{/users/save}" th:object="${user}" method="post">

            <!-- Required for EDIT -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label>Username</label>
                <input type="text" th:field="*{username}" required />
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" th:field="*{email}" required />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" th:field="*{password}" required />
            </div>

            <button type="submit"
                    th:text="${user.id == null ? 'Create User' : 'Update User'}">
            </button>
        </form>

        <div class="footer-link">
            <a th:href="@{/users}">← Back to user list</a>
        </div>

    </div>
</div>

</body>
</html>
