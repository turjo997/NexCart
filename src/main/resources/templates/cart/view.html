<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Your Shopping Cart</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #f5f7fb; padding: 30px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        h2 { color: #2c3e50; margin: 0; }
        .card { background: white; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 14px; text-align: left; }
        thead { background: #f0f2f7; }
        th { color: #555; font-weight: 600; }
        .quantity-input { width: 70px; padding: 8px; }
        .btn { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn-primary { background: #4a6cf7; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-sm { padding: 6px 10px; font-size: 13px; }
        .total { text-align: right; font-size: 18px; margin: 20px 0; }
        .empty { text-align: center; padding: 40px; color: #777; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Shopping Cart
            <span th:if="${currentUser}" th:text="'for ' + ${currentUser.username}"></span>
        </h2>
        <a th:href="@{/products(userId=${currentUser.id})}" class="btn btn-primary">Continue Shopping</a>
    </div>

    <!-- Message Display Area -->
    <div th:if="${successMessage}" class="alert alert-success" style="margin: 20px 0; padding: 12px; background: #d4edda; color: #155724; border-radius: 6px; border: 1px solid #c3e6cb;">
        <strong>Success!</strong> <span th:text="${successMessage}"></span>
    </div>

    <div th:if="${errorMessage}" class="alert alert-danger" style="margin: 20px 0; padding: 12px; background: #f8d7da; color: #721c24; border-radius: 6px; border: 1px solid #f5c6cb;">
        <strong>Error:</strong> <span th:text="${errorMessage}"></span>
    </div>

    <div class="card" th:unless="${cartItems.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>Product</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cartItems}">
                <td th:text="${item.product.name}"></td>
                <td th:text="${item.product.price}"></td>
                <td>
                    <form th:action="@{/cart/update}" method="post" style="display:flex; align-items:center; gap:8px;">
                        <input type="hidden" name="productId" th:value="${item.product.id}"/>
                        <input type="hidden" name="userId" th:value="${currentUser.id}"/>
                        <input type="number" name="quantity" th:value="${item.quantity}"
                               min="1" class="quantity-input" style="width:80px;"/>
                        <button type="submit" class="btn btn-primary btn-sm">Update</button>
                    </form>
                </td>
                <td th:text="${item.product.price * item.quantity}"></td>
                <td>
                    <form th:action="@{/cart/remove}" method="post" style="display:inline;">
                        <input type="hidden" name="productId" th:value="${item.product.id}"/>
                        <input type="hidden" name="userId" th:value="${currentUser.id}"/>
                        <button type="submit" class="btn btn-danger btn-sm"
                                onclick="return confirm('Remove this item from cart?')">
                            Remove
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="total">
            <strong>Grand Total: $</strong>
            <span th:text="${#numbers.formatDecimal(grandTotal, '0', '2')}"></span>
        </div>

        <div style="text-align: right; padding: 20px;">
            <form th:action="@{/cart/clear}" method="post" style="display:inline;">
                <input type="hidden" name="userId" th:value="${currentUser.id}"/>
                <button type="submit" class="btn btn-danger"
                        onclick="return confirm('Clear entire cart?')">
                    Clear Cart
                </button>
            </form>
            <a th:href="@{/checkout(userId=${currentUser.id})}"
               class="btn btn-primary" style="margin-left:10px;">
                Proceed to Checkout
            </a>
        </div>
    </div>

    <div class="card empty" th:if="${cartItems.isEmpty()}">
        <p>Your cart is empty.</p>
        <a th:href="@{/products(userId=${currentUser.id})}" class="btn btn-primary">
            Browse Products
        </a>
    </div>
</div>

</body>
</html>
